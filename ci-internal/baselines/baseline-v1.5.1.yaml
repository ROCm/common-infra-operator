# baseline-v1.5.1.yaml
#
# Versioned seed manifest for CI validation.
#
# K8s: gpu-operator and kmm pinned to released v1.5.1.
# OpenShift: gpu-operator installed via OLM Subscription from certified-operators
#            catalog (amd-gpu-operator.v1.5.2, channel: alpha).
# Static entries (device-plugin, node-labeller, init-container) pass through as-is.
#
# Override slots (entries with no 'version' field) are filled in by
# gen_image_manifest.py from the scenario config.
#
images:
  meta:
    registry:
      default: docker.io
    operator: gpu-operator
    version: v1.5.1
  k8:
    driver:
      key: driver.image
      kind: container

    gpu-operator:
      location: repo://rocm.github.io/gpu-operator:gpu-operator-charts
      version: v1.5.1
      kind: helm-chart

    gpu-controller-manager:
      key: controllerManager.manager.image
      location: container://<registry>/rocm/gpu-operator
      version: v1.5.1
      kind: container

    gpu-operator-utils:
      key: commonConfig.utilsContainer
      location: container://<registry>/rocm/gpu-operator-utils
      version: v1.5.1
      kind: container

    remediation-config-utils:
      key: remediationWorkflow.configMapImage
      location: container://<registry>/rocm/gpu-operator-remediation-configmap-util
      version: v1.5.1
      kind: container

    device-metrics-exporter:
      key: metricsExporter.image
      location: container://<registry>/amdpsdo/device-metrics-exporter
      kind: container
      secret: docker-amdpsdo-auth

    test-runner:
      key: testRunner.image
      location: container://<registry>/amdpsdo/test-runner
      kind: container
      secret: docker-amdpsdo-auth

    config-manager:
      key: configManager.image
      location: container://<registry>/amdpsdo/device-config-manager
      kind: container
      secret: docker-amdpsdo-auth

    device-plugin:
      key: devicePlugin.devicePluginImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: latest
      kind: container

    node-labeller:
      key: devicePlugin.nodeLabellerImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: labeller-latest
      kind: container

    kmm-controller-manager:
      key: kmm.controller.manager.image
      location: container://<registry>/rocm/kernel-module-management-operator
      version: v1.5.1
      kind: container

    kmm-controller-manager-worker:
      key: kmm.controller.manager.env.relatedImageWorker
      location: container://<registry>/rocm/kernel-module-management-worker
      version: v1.5.1
      kind: container

    kmm-controller-manager-image-sign:
      key: kmm.controller.manager.env.relatedImageSign
      location: container://<registry>/rocm/kernel-module-management-signimage
      version: v1.5.1
      kind: container

    kmm-webhook-server:
      key: kmm.webhookServer.webhookServer.image
      location: container://<registry>/rocm/kernel-module-management-webhook-server
      version: v1.5.1
      kind: container

    init-container-image:
      key: commonConfig.initContainerImage
      location: container://<registry>/busybox
      version: '1.36'
      kind: container

  openshift:
    driver:
      key: driver.image
      location: container://image-registry.openshift-image-registry.svc:5000/openshift-amd-gpu/amdgpu_kmod
      kind: container

    driver-source:
      key: driver.imageBuild.sourceImageRepo
      location: container://docker.io/amdpsdo/amdgpu-driver
      kind: container
      secret: docker-amdpsdo-auth

    gpu-operator:
      kind: olm-subscription
      catalog: certified-operators
      channel: alpha
      package: amd-gpu-operator
      csv: amd-gpu-operator.v1.5.2

    gpu-operator-utils:
      key: commonConfig.utilsContainer
      location: container://<registry>/rocm/gpu-operator-utils
      version: v1.5.1
      kind: container

    remediation-config-utils:
      key: remediationWorkflow.configMapImage
      location: container://<registry>/rocm/gpu-operator-remediation-configmap-util
      version: v1.5.1
      kind: container

    device-metrics-exporter:
      key: metricsExporter.image
      location: container://<registry>/amdpsdo/device-metrics-exporter
      kind: container
      secret: docker-amdpsdo-auth

    test-runner:
      key: testRunner.image
      location: container://<registry>/amdpsdo/test-runner
      kind: container
      secret: docker-amdpsdo-auth

    config-manager:
      key: configManager.image
      location: container://<registry>/amdpsdo/device-config-manager
      kind: container
      secret: docker-amdpsdo-auth

    device-plugin:
      key: devicePlugin.devicePluginImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: latest
      kind: container

    node-labeller:
      key: devicePlugin.nodeLabellerImage
      location: container://<registry>/rocm/k8s-device-plugin
      version: labeller-latest
      kind: container

    init-container-image:
      key: commonConfig.initContainerImage
      location: container://<registry>/busybox
      version: '1.36'
      kind: container

  standalone:
    device-metrics-exporter:
      key: metricsExporter.image
      location: container://<registry>/amdpsdo/device-metrics-exporter
      kind: container
      secret: docker-amdpsdo-auth
